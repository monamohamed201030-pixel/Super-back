<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperBack | إدارة الطلبات</title><meta name="robots" content="noindex,nofollow"><style>:root{--navy:#071b47;--blue:#0878df;--bg:#f5f7fa;--text:#10244d;--muted:#667085;--line:#e5eaf1;--green:#149447;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}header{background:var(--navy);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.wrap{max-width:1500px;margin:auto;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}.toolbar input{flex:1;min-width:200px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.blue{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.white{background:#fff;color:var(--text);border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1400px;font-size:12px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{background:#f8fafc;position:sticky;top:0}.status{padding:6px;border-radius:8px;border:1px solid #cfd7e3;font:inherit}.note{width:180px;min-height:52px;padding:7px;border:1px solid #d5dbe5;border-radius:8px;font:inherit}.actions{display:flex;gap:6px;align-items:center}.phone{direction:ltr;display:inline-block}.danger{border:0;background:none;color:var(--red);cursor:pointer;font-weight:800}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><header><b>📦 SuperBack — إدارة الطلبات</b><span id="lastUpdate"></span></header><main class="wrap"><div class="stats" id="stats"></div><div class="toolbar"><input id="search" type="search" placeholder="بحث بالاسم، الجوال، المدينة، رقم الطلب..."><select id="filter"><option value="">كل الحالات</option></select><button class="btn blue" id="refresh">↻ تحديث</button><a class="btn white" href="/api/orders/export.csv">CSV</a><a class="btn green" href="/api/orders/export.xlsx">Excel</a></div><div class="tablewrap"><table><thead><tr><th>الطلب</th><th>التاريخ</th><th>العميل</th><th>الجوال</th><th>العنوان</th><th>الكمية</th><th>الإجمالي</th><th>المصدر</th><th>الحالة</th><th>ملاحظة</th><th>إجراء</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty">جارٍ تحميل الطلبات...</div></div></main><script>
let orders=[];const labels={new:'جديد',contacted:'تم الاتصال',confirmed:'مؤكد',preparing:'قيد التجهيز',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'ملغي',no_answer:'لم يرد',wrong_number:'رقم خاطئ',refused:'رفض الاستلام'};const filter=document.getElementById('filter');Object.entries(labels).forEach(([v,l])=>filter.insertAdjacentHTML('beforeend',`<option value="${v}">${l}</option>`));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stats(){const total=orders.length,newc=orders.filter(o=>o.status==='new').length,confirmed=orders.filter(o=>o.status==='confirmed').length,delivered=orders.filter(o=>o.status==='delivered').length,cancelled=orders.filter(o=>o.status==='cancelled').length,revenue=orders.filter(o=>!['cancelled','refused'].includes(o.status)).reduce((s,o)=>s+Number(o.total||0),0);document.getElementById('stats').innerHTML=`<div class="stat"><b>${total}</b><span>كل الطلبات</span></div><div class="stat"><b>${newc}</b><span>جديد</span></div><div class="stat"><b>${confirmed}</b><span>مؤكد</span></div><div class="stat"><b>${delivered}</b><span>تم التسليم</span></div><div class="stat"><b>${cancelled}</b><span>ملغي</span></div><div class="stat"><b>${revenue.toLocaleString('ar-SA')} ر.س</b><span>إيرادات غير ملغاة</span></div>`}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),f=filter.value;const rows=orders.filter(o=>(!f||o.status===f)&&(!q||[o.id,o.name,o.phone,o.city,o.district,o.source,o.campaign].some(v=>String(v||'').toLowerCase().includes(q)))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));const tbody=document.getElementById('tbody');document.getElementById('empty').style.display=rows.length?'none':'block';tbody.innerHTML=rows.map(o=>`<tr><td><b>${esc(o.id)}</b><br><small>${esc(o.sku)}</small></td><td>${new Date(o.createdAt).toLocaleString('ar-SA')}</td><td><b>${esc(o.name)}</b><br>${esc(o.city)} — ${esc(o.district)}<br>${esc(o.address)}</td><td><a class="phone" href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br><a href="https://wa.me/${String(o.phone||'').replace(/\D/g,'')}" target="_blank" rel="noopener">واتساب</a></td><td>${esc(o.city)}<br>${esc(o.address)}</td><td>${esc(o.quantity)}</td><td><b>${esc(o.total)} ر.س</b></td><td>${esc(o.source||'مباشر')}<br><small>${esc(o.campaign||'')}</small></td><td><select class="status" data-id="${esc(o.id)}">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select></td><td><textarea class="note" data-note="${esc(o.id)}">${esc(o.adminNote||'')}</textarea><button class="btn white save" data-id="${esc(o.id)}">حفظ</button></td><td><button class="danger delete" data-id="${esc(o.id)}">حذف</button></td></tr>`).join('');}
async function load(){try{const r=await fetch('/api/orders');if(!r.ok)throw new Error();orders=await r.json();stats();render();document.getElementById('lastUpdate').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-SA')}catch(e){document.getElementById('empty').textContent='تعذر تحميل الطلبات. تأكد من صلاحية الدخول.'}}
async function patch(id,status,note){const r=await fetch('/api/orders/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,adminNote:note})});if(!r.ok){alert('تعذر حفظ التعديل');return false}const data=await r.json();const i=orders.findIndex(o=>o.id===id);if(i>=0)orders[i]=data.order;return true}
document.getElementById('tbody').addEventListener('change',async e=>{if(!e.target.classList.contains('status'))return;const id=e.target.dataset.id;const o=orders.find(x=>x.id===id);await patch(id,e.target.value,o?.adminNote||'');stats();render()});document.getElementById('tbody').addEventListener('click',async e=>{if(e.target.classList.contains('delete')){const id=e.target.dataset.id;if(!confirm('حذف الطلب نهائيًا؟'))return;const r=await fetch('/api/orders/'+encodeURIComponent(id),{method:'DELETE'});if(r.ok){orders=orders.filter(o=>o.id!==id);stats();render()}}if(e.target.classList.contains('save')){const id=e.target.dataset.id;const note=document.querySelector(`[data-note="${CSS.escape(id)}"]`)?.value||'';const status=document.querySelector(`.status[data-id="${CSS.escape(id)}"]`)?.value||'new';if(await patch(id,status,note)){stats();render()}}});document.getElementById('search').addEventListener('input',render);filter.addEventListener('change',render);document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
