<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاسترجاع والاستبدال | SuperBack</title><style>body{font-family:Tahoma,Arial;max-width:800px;margin:auto;padding:25px;line-height:2;color:#10244d}a{color:#0878df}</style><h1>الاسترجاع والاستبدال</h1><p>يجب التواصل مع خدمة العملاء قبل أي استرجاع أو استبدال. تقبل الطلبات وفق حالة المنتج وسياسة المتجر وشروط شركة الشحن المعتمدة.</p><p>لا تستخدم المنتج إذا كان به عيب ظاهر، واحتفظ بالعبوة ومحتوياتها حتى يتم تقييم الحالة.</p><a href="/">العودة للمتجر</a></html>
