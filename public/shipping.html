<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سياسة الشحن | SuperBack</title><style>body{font-family:Tahoma,Arial;max-width:800px;margin:auto;padding:25px;line-height:2;color:#10244d}a{color:#0878df}</style><h1>سياسة الشحن</h1><p>يتم تأكيد طلبات الدفع عند الاستلام هاتفيًا قبل تجهيزها للشحن. مدة وتغطية الشحن تعتمد على شركة الشحن والمنطقة، ويتم إبلاغ العميل بالتفاصيل المتاحة عند التأكيد.</p><p>قد تتغير مدة التوصيل بسبب العنوان أو ظروف شركة الشحن أو المواسم.</p><a href="/">العودة للمتجر</a></html>
